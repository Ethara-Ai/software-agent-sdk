# ---------------------------------------------------------------------------
# Scanner command/config policy. The APPROVED digest binds this argv set; the
# §1.10 command-integrity check compares actual argv against it. Widening an
# ignore-list changes the digest and re-triggers sign-off.
# ---------------------------------------------------------------------------
scanner_command_config_policy:
  ignore_allow_list_globs:
    - "**/.venv/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.git/**"
    - "**/__pycache__/**"
    - "**/*.egg-info/**"
    - "**/.worktrees/**"
    - "**/audit/results/**"
  semgrep_forbidden:
    - "--config auto as sole profile"
  db_pin_required: [semgrep, trivy, osv_scanner, pip_audit, gitleaks]
  approved_argv:
    ruff: "ruff check --output-format json ."
    ruff_format: "ruff format --check ."
    bandit: "bandit -r openhands-sdk openhands-tools openhands-workspace openhands-agent-server -f json -q"
    semgrep_pinned: "semgrep --config p/owasp-top-ten --config p/r2c-security-audit --config p/secrets --config .crucible/semgrep --metrics=off --json ."
    pip_audit: "pip-audit --format json"
    osv_scanner: "osv-scanner --lockfile=uv.lock --format=json"
    gitleaks_full_history: "gitleaks detect --source . --report-format json --redact --log-opts=--all"
    gitleaks_working_tree: "gitleaks detect --source . --no-git --report-format json --redact"
    hadolint: "hadolint --format json <dockerfile>"
    trivy_fs: "trivy fs --format json --quiet ."
    semgrep_node: "semgrep --config p/javascript --metrics=off --json <node_dir>"

