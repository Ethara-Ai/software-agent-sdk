    Human writes the hex sha256 of THIS file into audit/scope.approved. The
    Phase-1 scaffolder (and audit verify) recompute sha256(scope.yaml) and
    refuse to proceed unless it matches.
  binds: [required_instruments, conditional_instruments, scanner_command_config_policy, required_policy_version]
  rescope_triggers_resignoff: true
