# UV workspace configuration
[tool.uv.workspace]
members = ["openhands-sdk", "openhands-tools", "openhands-workspace", "openhands-agent-server"]

# Security: Enforce minimum versions for transitive dependencies with known CVEs
# Floors below are derived from an osv-scanner sweep of uv.lock (CRUCIBLE
# CRUCIBLE-2); each is the lowest fixed version above what was previously locked.
[tool.uv]
constraint-dependencies = [
    "starlette>=1.3.1",  # CVE-2025-62727 + osv sweep
    "aiohttp>=3.14.1",  # osv: 21 advisories fixed by 3.14.1
    "urllib3>=2.7.0",  # CVE-2026-21441, CVE-2025-66471, CVE-2025-66418 + osv
    "protobuf>=6.33.5",  # CVE-2026-0994
    "pillow>=12.2.0",  # CVE-2026-25990 + osv
    "orjson>=3.11.7",  # CVE-2025-67221
    "authlib>=1.7.1",  # osv sweep (9 advisories); transitive via browser-use
    "cryptography>=48.0.1",  # osv sweep (5 advisories)
    # fastmcp pinned to the 2.x line: 3.x is an API-breaking major (moves
    # fastmcp.mcp_config) that breaks openhands-sdk skill.py. The SDK declares
    # fastmcp>=2.11.3 with an open upper bound, so a bare resolve floats to 3.x
    # and breaks imports. Cap at <3 until a coordinated 3.x migration. The 4
    # fastmcp advisories are tracked as HOLD. See REPORT.md.
    "fastmcp>=2.11.3,<3",
    "gitpython>=3.1.50",  # osv sweep (5 advisories)
    "idna>=3.15",  # osv sweep
    # litellm is sourced from the Ethara-Ai/litellm git fork (see tool.uv.sources);
    # a version constraint cannot move it. Its 8 advisories require a fork rebase
    # onto litellm>=1.84.0 — tracked as HOLD (maintainer decision). See REPORT.md.
    "lxml>=6.1.0",  # osv sweep
    "mako>=1.3.12",  # osv sweep
    "pyarrow>=23.0.1",  # osv sweep
    "pyasn1>=0.6.3",  # osv sweep
    "pygments>=2.20.0",  # osv sweep
    "pyjwt>=2.13.0",  # osv sweep (12 advisories)
    "pypdf>=6.13.3",  # osv sweep (16 advisories)
    "python-dotenv>=1.2.2",  # osv sweep
    "python-multipart>=0.0.31",  # osv sweep (6 advisories)
    "requests>=2.33.0",  # osv sweep
    "tornado>=6.5.7",  # osv sweep (8 advisories)
    "pip>=26.1.2",  # osv sweep (PYSEC-2026-196 + 2 GHSA); build tool, safe bump
]

# Workspace sources for intra-repo dependencies
[tool.uv.sources]
openhands-sdk = { workspace = true }
openhands-tools = { workspace = true }
openhands-workspace = { workspace = true }
openhands-agent-server = { workspace = true }
# Use forked litellm with Vertex AI Express mode support
litellm = { git = "https://github.com/Ethara-Ai/litellm.git", branch = "main" }

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "packaging>=24.2",
    "psutil>=7.0.0",
    "pyright[nodejs]>=1.1.405",
    "pytest>=8.4.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.10",
    "pycodestyle>=2.12.0",
    "pytest-asyncio>=1.1.0",
    "pytest-forked>=1.6.0",
    "pytest-xdist>=3.6.0",
    "tabulate>=0.9.0",
    "pyinstaller>=6.16.0",
    "streamlit>=1.49.1",
    "pytest-timeout>=2.4.0",
    "griffe[pypi]>=2.0.0",
]

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (includes F841: unused-variable)
    "I",    # isort
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
]
# Enforce rules that catch mutable defaults and related pitfalls
# - B006: mutable-argument-default
# - B008: function-call-in-default-argument
# - B039: mutable-contextvar-default
# - RUF012: mutable-class-default
extend-select = ["B006", "B008", "B039", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Test files often have unused arguments (fixtures, mocks, interface implementations)
"tests/**/*.py" = ["ARG"]


# Allowlist safe default calls for flake8-bugbear rules (e.g., FastAPI Depends)
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
]

[tool.ruff.lint.isort]
known-first-party = ["openhands"]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

# Pytest configuration
[tool.pytest.ini_options]
testpaths = [
    "tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

# Pyright configuration for PEP 420 namespace packages
# This is needed for VSCode to properly resolve imports across multiple packages in the monorepo
[tool.pyright]
include = [
    "openhands-sdk",
    "openhands-tools",
    "openhands-workspace",
    "openhands-agent-server",
    "examples",
    "tests",
    "scripts"
]
extraPaths = [
    "openhands-sdk",
    "openhands-tools",
    "openhands-workspace",
    "openhands-agent-server"
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
useLibraryCodeForTypes = true
typeCheckingMode = "standard"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
